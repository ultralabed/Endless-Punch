<style>

</style>

  🔥 打越多下怒氣越滿，滿了按它＝大爆拳<br>🛒 用錢到<b>商店</b>買道具，打架時按來用<br>🌳 用錢到<b>科技樹</b>升級，會永遠變強<br><br>
  🔴 小兵　🟡 跑很快　🟣 血很厚<br>🟢 會丟球（要躲開！）　⚫ 魔王</p>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=id=>document.getElementById(id);
const C=$('c'),MAXSTAGE=30,KEY='boomfist_v2',ARENA=28;

/* ================= 存檔 ================= */
const fresh=()=>({unlocked:1,stages:{},endless:{best:0,kills:0},total:0,mute:false,money:0,earned:0,items:{},tech:{}});
let save=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)save=Object.assign(save,s)}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}document.querySelectorAll('.mny').forEach(m=>m.textContent=save.money)}

/* ================= 科技樹 / 道具 資料 ================= */
const TECH={
  p1:{n:'鐵拳',e:'👊',d:'攻擊力 +20%',max:5,base:40,req:null,x:.5,y:1},
  p2:{n:'快拳',e:'💨',d:'出拳速度 +12%',max:5,base:50,req:'p1',x:0,y:2},
  p3:{n:'長臂',e:'🦾',d:'打得到更遠 +10%',max:3,base:60,req:'p1',x:1,y:2},
  p4:{n:'爆擊',e:'💥',d:'爆擊機率 +8%（傷害 2 倍）',max:5,base:80,req:'p2',x:0,y:3},
  p6:{n:'連環拳',e:'🥊',d:'一次多打 1 個壞蛋',max:2,base:150,req:'p3',x:1,y:3},
  p5:{n:'震波拳',e:'🌀',d:'打中時旁邊的壞蛋也受傷',max:3,base:160,req:'p4',x:0,y:4},
  b1:{n:'強壯',e:'❤️',d:'血量 +20',max:5,base:40,req:null,x:2.5,y:1},
  b2:{n:'飛毛腿',e:'👟',d:'走路速度 +8%',max:4,base:50,req:'b1',x:2,y:2},
  b3:{n:'回血',e:'💚',d:'每秒自己補 1 滴血',max:3,base:70,req:'b1',x:3,y:2},
  b4:{n:'鐵布衫',e:'🛡️',d:'受到的傷害 -10%',max:4,base:90,req:'b3',x:3,y:3},
  b5:{n:'復活',e:'👼',d:'每場可以倒下後再站起來 1 次',max:1,base:400,req:'b4',x:3,y:4},
  f1:{n:'撿錢高手',e:'💰',d:'掉的錢 +20%',max:5,base:40,req:null,x:4.5,y:1},
  f2:{n:'磁鐵',e:'🧲',d:'更遠就能吸到錢 +30%',max:3,base:50,req:'f1',x:4,y:2},
  f3:{n:'殺價',e:'🏷️',d:'商店道具便宜 10%',max:3,base:70,req:'f1',x:5,y:2},
  f4:{n:'怒火',e:'🔥',d:'怒氣集得更快 +20%',max:3,base:90,req:'f2',x:4,y:3},
  f5:{n:'紅利',e:'🎁',d:'每場結束多拿 10% 的錢',max:3,base:120,req:'f3',x:5,y:3}
};
const ITEMS={
  potion:{n:'補血藥',e:'🧪',d:'馬上補回一半的血',price:50},
  bomb:{n:'炸彈',e:'💣',d:'炸飛身邊一大圈的壞蛋',price:80},
  ice:{n:'冰凍',e:'❄️',d:'所有壞蛋結冰 4 秒不能動',price:70},
  rage:{n:'狂暴藥',e:'⚡',d:'8 秒內出拳 2 倍快、更痛',price:90},
  shield:{n:'護盾',e:'🫧',d:'5 秒內不會受傷',price:100}
};
const tl=k=>save.tech[k]||0;
const techCost=k=>Math.round(TECH[k].base*Math.pow(1.7,tl(k))/5)*5;
const itemPrice=k=>Math.round(ITEMS[k].price*(1-.1*tl('f3'))/5)*5;
function stats(){return{dmg:10*(1+.2*tl('p1')),atk:.42/(1+.12*tl('p2')),range:2.3*(1+.1*tl('p3')),crit:.08*tl('p4'),splash:tl('p5')?.9+.5*tl('p5'):0,multi:1+tl('p6'),
  hp:100+20*tl('b1'),spd:5.2*(1+.08*tl('b2')),regen:tl('b3'),armor:1-.1*tl('b4'),revive:tl('b5'),coin:1+.2*tl('f1'),pick:2.4*(1+.3*tl('f2')),fury:1+.2*tl('f4'),interest:.1*tl('f5')}}

/* ================= 聲音 (全部用程式合成) ================= */
let ac=null,master=null,musicG=null,noiseBuf=null,musicOn=false,step=0,nextT=0;
function initAudio(){
  if(ac){if(ac.state!=='running')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();master=ac.createGain();master.gain.value=save.mute?0:1;master.connect(ac.destination);
  musicG=ac.createGain();musicG.gain.value=.5;musicG.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(musicTick,60);
}
function tone(f0,f1,dur,type,vol,t,out){
  if(!ac)return;t=t||ac.currentTime;
  const o=ac.createOscillator(),v=ac.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(v);v.connect(out||master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,freq,ftype,vol,t,out){
  if(!ac)return;t=t||ac.currentTime;
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();
  s.buffer=noiseBuf;f.type=ftype;f.frequency.value=freq;
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(v);v.connect(out||master);s.start(t,Math.random()*.3,dur+.02);
}
const seq=(a,d,type,vol)=>a.forEach((f,i)=>tone(f,f,d*1.4,type,vol,ac&&ac.currentTime+i*d));
let lastHit=0;
const sfx={
  hit(c){if(!ac||ac.currentTime-lastHit<.05)return;lastHit=ac.currentTime;noise(.08,1400,'lowpass',.6);tone(c?320:190,55,.11,'sine',.7);if(c)tone(1200,500,.08,'square',.12)},
  ko(){noise(.14,900,'lowpass',.6);tone(140,40,.18,'sine',.6)},
  hurt(){tone(260,70,.25,'sawtooth',.3);noise(.15,500,'lowpass',.5)},
  click(){tone(660,880,.06,'square',.15)},
  coin(){tone(1320,1760,.07,'square',.07)},
  buy(){seq([784,1047,1319],.07,'square',.15)},
  no(){tone(180,120,.15,'square',.15)},
  fury(){noise(.7,700,'lowpass',1);tone(90,30,.7,'sawtooth',.6);tone(300,1500,.4,'square',.2)},
  ready(){seq([523,659,784,1047],.06,'square',.15)},
  heal(){seq([523,784,1047],.09,'sine',.3)},
  ice(){seq([2093,1568,2093,2637],.05,'triangle',.2);noise(.4,5000,'highpass',.2)},
  power(){tone(200,900,.4,'sawtooth',.25)},
  shoot(){tone(500,250,.12,'triangle',.12)},
  clear(){seq([523,659,784,1047,784,1047,1319],.11,'square',.2)},
  fail(){seq([392,330,262,196],.2,'sawtooth',.22)},
  boss(){seq([110,104,98,92],.25,'sawtooth',.35)}
};
const BASS=[45,45,48,43],LEAD=[69,0,72,0,76,0,72,69,0,67,69,0,72,0,67,0, 69,0,72,0,76,79,76,0,72,0,69,0,67,64,67,0];
const mf=m=>440*Math.pow(2,(m-69)/12);
function musicTick(){
  if(!ac||!musicOn||ac.state!=='running')return;
  const sd=60/138/4;if(nextT<ac.currentTime)nextT=ac.currentTime+.05;
  while(nextT<ac.currentTime+.2){
    const s=step%64,b=BASS[(s>>4)%4];

  G.spawnT-=dt;
  if(G.spawnT<=0&&G.en.length<45&&(G.toSpawn>0||G.boss)){
    let iv=Math.max(.26,1.35-lvl()*.036);if(G.boss)iv*=2.2;G.spawnT=iv*(.7+Math.random()*.6);
    spawn(G.boss?(Math.random()<.7?'grunt':'runner'):pickType());if(!G.boss)G.toSpawn--;
  }
  if(G.mode==='endless'&&!G.bossOut&&G.kills>=G.nextBoss)callBoss();
  if(G.mode==='stage'&&G.toSpawn<=0&&!G.en.length){
    if(G.stage%5===0&&!G.bossOut)callBoss();
    else if(!G.boss){G.state='clear';G.endT=1.6;musicOn=false;sfx.clear();float(H.x,3,H.z,'過關！','big');for(const c of G.coins)c.suck=true}
  }
  // 壞蛋
  const frozen=G.freezeT>0,E=G.en;
  for(const e of E){
    e.flash=Math.max(0,e.flash-dt);e.punchT=Math.max(0,e.punchT-dt);
    e.x+=e.kx*dt;e.z+=e.kz*dt;e.kx*=Math.pow(.0005,dt);e.kz*=Math.pow(.0005,dt);
    if(frozen)continue;
    const dx=H.x-e.x,dz=H.z-e.z,d=Math.hypot(dx,dz)||1,ux=dx/d,uz=dz/d;e.cd-=dt;e.walk+=dt;e.rot=Math.atan2(dx,dz);e.moving=false;
    if(e.type==='spit'){
      if(d>7.5){e.x+=ux*e.spd*dt;e.z+=uz*e.spd*dt;e.moving=true}else if(d<4.5){e.x-=ux*e.spd*.8*dt;e.z-=uz*e.spd*.8*dt;e.moving=true}
      e.shot-=dt;if(e.shot<=0&&d<10){e.shot=2.4;e.punchT=.2;shoot(e.x,e.z,ux,uz,6.5,e.T.dmg,ballMat)}
    }else{
      if(d>e.r+.75){e.x+=ux*e.spd*dt;e.z+=uz*e.spd*dt;e.moving=true;e.cd=Math.max(e.cd,.3)}
      else if(e.cd<=0){e.cd=1;e.punchT=.2;hurt(e.T.dmg)}
      if(e.type==='boss'){e.shot-=dt;if(e.shot<=0){e.shot=3.5;sfx.shoot();for(let i=0;i<10;i++){const a=i/10*6.283+G.time;shoot(e.x,e.z,Math.cos(a),Math.sin(a),5,12,ballMat2)}}}
    }
  }
  for(let i=0;i<E.length;i++)for(let j=i+1;j<E.length;j++){const a=E[i],b=E[j],dx=b.x-a.x,dz=b.z-a.z,m=a.r+b.r,d2=dx*dx+dz*dz;
    if(d2<m*m&&d2>1e-6){const d=Math.sqrt(d2),p=(m-d)/d*.5,wa=a.type==='boss'?.1:1,wb=b.type==='boss'?.1:1;a.x-=dx*p*wa;a.z-=dz*p*wa;b.x+=dx*p*wb;b.z+=dz*p*wb}}
  // 球
  for(const b of G.balls){b.x+=b.vx*dt;b.z+=b.vz*dt;b.t+=dt;b.m.position.set(b.x,.9,b.z);
    if(Math.hypot(b.x-H.x,b.z-H.z)<.6){b.t=99;if(G.shieldT<=0)hurt(b.dmg);burst(b.x,.9,b.z,4,2)}if(b.t>4)scene.remove(b.m)}
  G.balls=G.balls.filter(b=>b.t<=4);
  if(G.boss)$('bossw').firstChild.style.width=Math.max(0,G.boss.hp/G.boss.max*100)+'%';
}
function shoot(x,z,ux,uz,spd,dmg,m){const me=new THREE.Mesh(GEO.ball,m);scene.add(me);G.balls.push({m:me,x:x+ux*.6,z:z+uz*.6,vx:ux*spd,vz:uz*spd,dmg,t:0});if(m===ballMat)sfx.shoot()}
function updateCoins(dt){
  for(const c of G.coins){c.t+=dt;const dx=H.x-c.x,dz=H.z-c.z,d=Math.hypot(dx,dz)||1;
    if((d<H.st.pick||c.suck)&&G.state!=='dead'){const s=c.suck?30:16;c.x+=dx/d*s*dt;c.z+=dz/d*s*dt;c.y+=(.8-c.y)*.2;if(d<.6){c.val&&(G.money+=c.val);c.dead=true;sfx.coin();float(c.x,1.6,c.z,'+'+c.val,'g')}}
    else{c.x+=c.vx*dt;c.z+=c.vz*dt;c.vx*=.9;c.vz*=.9;c.y+=c.vy*dt;c.vy-=20*dt;if(c.y<.3){c.y=.3;c.vy=0}}
    if(c.t>20)c.dead=true;
    c.m.position.set(c.x,c.y,c.z);c.m.rotation.z=Math.PI/2;c.m.rotation.y+=dt*6;if(c.dead)scene.remove(c.m)}
  G.coins=G.coins.filter(c=>!c.dead);
}
function bank(bonus){const total=Math.round((G.money+bonus)*(1+H.st.interest));save.money+=total;save.earned+=total;G.money=0;return total}
function finish(win){
  G.state='over';let isNew=false,body='',bonus=0;$('hud').classList.remove('on');
  if(G.mode==='stage'){
    const st=save.stages[G.stage]||{stars:0,best:0};
    if(win){const r=H.hp/H.st.hp,stars=r>.66?3:r>.33?2:1;bonus=(20+G.stage*10)*(st.stars?1:2);G.score+=stars*100*G.stage;
      isNew=G.score>st.best;st.stars=Math.max(st.stars,stars);st.best=Math.max(st.best,G.score);save.stages[G.stage]=st;
      save.unlocked=Math.max(save.unlocked,Math.min(MAXSTAGE,G.stage+1));$('rStars').innerHTML='★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i>'}
    $('rTitle').textContent=win?`第 ${G.stage} 關 過關！`:`第 ${G.stage} 關 失敗…`;$('rStars').style.display=win?'':'none';$('bNext').style.display=win&&G.stage<MAXSTAGE?'':'none';
    const picked=G.money,got=bank(bonus);
    body=`分數<b>${G.score}</b><br>打倒<b>${G.kills}</b><br>撿到的錢<b>💰 ${picked}</b><br>`+(win?`過關獎金<b>💰 ${bonus}</b><br>`:'')+`這場總共賺<b>💰 ${got}</b>`+(win?'':'<br><span style="font-size:13px;color:#ffd23f">打不過？去商店或科技樹變強！</span>');
  }else{
    const E=save.endless;isNew=G.score>E.best;E.best=Math.max(E.best,G.score);E.kills=Math.max(E.kills,G.kills);
    $('rTitle').textContent='無盡模式 結束';$('rStars').style.display='none';$('bNext').style.display='none';
    const got=bank(0);body=`分數<b>${G.score}</b><br>打倒<b>${G.kills}</b><br>這場總共賺<b>💰 ${got}</b><br>歷史最高分<b>${E.best}</b>`;
  }
  $('rNew').style.display=isNew&&G.score>0?'':'none';$('rBody').innerHTML=body;store();showOv('result');
}

/* ----- 畫面 ----- */
let hudT=0,menuA=0;
function render(dt){
  // 英雄
  heroMesh.position.x=H.x;heroMesh.position.z=H.z;
  if(G.state==='menu'||G.state==='over'){menuA+=dt*.5;if(G.state==='menu'){heroMesh.rotation.y=menuA*2;animChar(heroMesh,menuA,false,Math.max(0,Math.sin(menuA*6)),Math.sin(menuA*3)>0?1:-1)}}
  else{let dr=H.rot-heroMesh.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));heroMesh.rotation.y+=dr*Math.min(1,dt*18);
    animChar(heroMesh,H.walk,H.moving,Math.min(1,H.punchT/.09),H.side);
    heroMesh.scale.setScalar(G.rageT>0?1.35:1.15);bubble.visible=G.shieldT>0;
    heroMesh.visible=!(G.shieldT>0&&G.shieldT<1&&Math.floor(G.shieldT*12)%2)}
  for(const e of G.en){e.g.position.set(e.x,0,e.z);e.g.rotation.y=e.rot||0;e.g.scale.setScalar(e.T.sz*(e.flash>0?1.25:1));animChar(e.g,e.walk,e.moving&&G.freezeT<=0,Math.min(1,e.punchT/.12),1)}
  // 鏡頭
  const k=cam.aspect<.8?1:.72,sh=G.shake;
  const tx=G.state==='menu'?0:H.x,tz=G.state==='menu'?0:H.z;
  if(G.state==='menu')cam.position.set(Math.sin(menuA*.3)*4,3.2,6);
  else cam.position.set(tx+(Math.random()-.5)*sh,14*k+(Math.random()-.5)*sh,tz+9*k);
  cam.lookAt(tx,G.state==='menu'?1.2:.6,tz);
  renderer.render(scene,cam);
  // HUD
  hudT-=dt;if(hudT<=0&&G.state!=='menu'){hudT=.1;
    $('hp').style.width=Math.max(0,H.hp/H.st.hp*100)+'%';$('hpt').textContent=Math.ceil(H.hp)+' / '+H.st.hp;$('coin').textContent='💰 '+G.money;
    $('lab').textContent=(G.mode==='stage'?`第 ${G.stage} 關`:`無盡 Lv.${lvl()}`)+'　分數 '+G.score;
    if(G.mode==='stage')$('prog').firstChild.style.width=Math.min(100,G.kills/G.need*100)+'%';
    $('buffs').textContent=(G.rageT>0?`⚡${G.rageT.toFixed(0)} `:'')+(G.shieldT>0?`🫧${G.shieldT.toFixed(0)} `:'')+(G.freezeT>0?`❄️${G.freezeT.toFixed(0)}`:'');
    const f=$('bFury');if(f){f.firstChild.style.height=G.fury+'%';f.classList.toggle('full',G.fury>=100)}
    scene.fog.near=G.freezeT>0?10:24}
}
let last=0;
function loop(t){const dt=Math.min(.034,(t-last)/1000||0);last=t;if(G.state!=='pause'){update(dt);updateCoins(dt)}render(dt);requestAnimationFrame(loop)}

/* ================= 操作 ================= */
function joyStart(id,x,y){if(G.state!=='play'||joy.on)return;joy.on=true;joy.id=id;joy.ox=x;joy.oy=y;joy.x=joy.z=0;const j=$('joy');j.style.display='block';j.style.left=x+'px';j.style.top=y+'px';j.firstChild.style.transform=''}
function joyMove(x,y){let dx=x-joy.ox,dy=y-joy.oy;const l=Math.hypot(dx,dy),R=48;if(l>R){dx*=R/l;dy*=R/l}joy.x=dx/R;joy.z=dy/R;$('joy').firstChild.style.transform=`translate(${dx}px,${dy}px)`}
function joyEnd(){joy.on=false;joy.x=joy.z=0;$('joy').style.display='none'}
C.addEventListener('touchstart',e=>{e.preventDefault();initAudio();const t=e.changedTouches[0];joyStart(t.identifier,t.clientX,t.clientY)},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(joy.on&&t.identifier===joy.id)joyMove(t.clientX,t.clientY)},{passive:false});
const te=e=>{for(const t of e.changedTouches)if(t.identifier===joy.id)joyEnd()};C.addEventListener('touchend',te);C.addEventListener('touchcancel',te);
C.addEventListener('mousedown',e=>{initAudio();joyStart('m',e.clientX,e.clientY)});
addEventListener('mousemove',e=>{if(joy.on&&joy.id==='m')joyMove(e.clientX,e.clientY)});addEventListener('mouseup',()=>{if(joy.id==='m')joyEnd()});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.repeat)return;if(e.key===' ')fury();const i='12345'.indexOf(e.key);if(i>=0)useItem(Object.keys(ITEMS)[i]);
  if(e.key==='Escape'){if(G.state==='play')pauseGame();else if(G.state==='pause')resume()}});
addEventListener('keyup',e=>{keys[e.key]=false});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 選單 ================= */
let backTo='menu';
function showOv(id){document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('on',o.id===id))}
function pauseGame(){G.state='pause';musicOn=false;joyEnd();showOv('pause')}
function resume(){G.state='play';musicOn=true;showOv(null)}
function toMenu(){if(G.state==='pause'){bank(0);store()}G.state='menu';clearWorld();H.x=H.z=0;heroMesh.visible=true;heroMesh.rotation.set(0,0,0);heroMesh.scale.setScalar(1.15);bubble.visible=false;musicOn=false;setTheme(0);$('hud').classList.remove('on');backTo='menu';showOv('menu')}
function press(b,f){const h=e=>{e.preventDefault();f()};b.addEventListener('touchstart',h,{passive:false});b.addEventListener('mousedown',h)}
function buildBar(){
  const bar=$('bar');bar.innerHTML='';
  Object.keys(ITEMS).forEach(k=>{const b=document.createElement('button'),n=save.items[k]||0;b.innerHTML=ITEMS[k].e+'<b>'+n+'</b>';b.disabled=!n;press(b,()=>useItem(k));bar.appendChild(b);
    if(k==='bomb'){const f=document.createElement('button');f.id='bFury';f.innerHTML='<i></i><span>🔥</span>';press(f,fury);bar.appendChild(f)}});
}
function buildGrid(){
  const gd=$('grid');gd.innerHTML='';
  for(let i=1;i<=MAXSTAGE;i++){const b=document.createElement('button'),st=save.stages[i],open=i<=save.unlocked;
    b.className=open?(i%5===0?'boss':''):'lock';b.innerHTML=(open?i:'🔒')+'<span>'+(st?'★'.repeat(st.stars):'')+'</span>';
    if(open)b.onclick=()=>{sfx.click();startGame('stage',i)};gd.appendChild(b)}
}
function buildShop(){
  const L=$('shopList');L.innerHTML='';
  for(const k in ITEMS){const it=ITEMS[k],n=save.items[k]||0,p=itemPrice(k),d=document.createElement('div');d.className='it';
    d.innerHTML=`<div class="e">${it.e}</div><div class="t"><b>${it.n} <i>×${n}</i></b>${it.d}</div>`;
    const b=document.createElement('button');b.textContent=n>=9?'滿了':'💰 '+p;b.disabled=n>=9||save.money<p;
    b.onclick=()=>{initAudio();if(save.money<p||n>=9){sfx.no();return}save.money-=p;save.items[k]=n+1;sfx.buy();store();buildShop()};d.appendChild(b);L.appendChild(d)}
}
let selT='p1';
function buildTree(){
  const T=$('tree'),cw=Math.min(60,(innerWidth-16)/6),rh=84,W=cw*6;T.style.width=W+'px';T.style.height=(rh*4+70)+'px';
  const pos=k=>k?[TECH[k].x*cw+cw/2,(TECH[k].y-1)*rh+50+26]:null;let svg='',html='';
  [['👊 力量',0],['❤️ 身體',2],['💰 財富',4]].forEach(b=>html+=`<div class="bl" style="left:${b[1]*cw}px;width:${cw*2}px;top:0;font-size:15px">${b[0]}</div>`);
  for(const k in TECH){const t=TECH[k],[x,y]=pos(k),l=tl(k),av=!t.req||tl(t.req)>0;
    if(t.req){const[px,py]=pos(t.req);svg+=`<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" stroke="${av?'#69db7c':'#555'}" stroke-width="4"/>`}
    html+=`<button class="nd ${l>=t.max?'own maxed':l?'own':av?'av':''} ${k===selT?'sel':''}" data-k="${k}" style="left:${x-26}px;top:${y-26}px">${t.e}<span>${l}/${t.max}</span></button>`}
  T.innerHTML=`<svg>${svg}</svg>`+html;
  T.querySelectorAll('.nd').forEach(b=>b.onclick=()=>{initAudio();sfx.click();selT=b.dataset.k;buildTree()});
  const t=TECH[selT],l=tl(selT),av=!t.req||tl(t.req)>0,c=techCost(selT),I=$('tInfo');
  I.innerHTML=`<div><b>${t.e} ${t.n}</b>　等級 ${l}/${t.max}<br>每升一級：${t.d}<br>${av?'':'🔒 要先學會「'+TECH[t.req].n+'」'}</div>`;
  const b=document.createElement('button');b.textContent=l>=t.max?'已滿級':'💰 '+c;b.disabled=l>=t.max||!av||save.money<c;
  b.onclick=()=>{if(save.money<c)return;save.money-=c;save.tech[selT]=l+1;sfx.buy();store();buildTree()};I.appendChild(b);
}
function on(id,f){$(id).addEventListener('click',()=>{initAudio();sfx.click();f()})}
on('bStage',()=>{buildGrid();showOv('stages')});on('bEndless',()=>startGame('endless'));on('bHow',()=>showOv('how'));
on('bShop',()=>{backTo='menu';buildShop();showOv('shop')});on('bTech',()=>{backTo='menu';buildTree();showOv('tech')});
on('bShop2',()=>{backTo='result';buildShop();showOv('shop')});on('bTech2',()=>{backTo='result';buildTree();showOv('tech')});
on('bRec',()=>{let stars=0,cleared=0,sum=0,tech=0;for(const k in save.stages){stars+=save.stages[k].stars;sum+=save.stages[k].best;if(save.stages[k].stars)cleared++}for(const k in save.tech)tech+=save.tech[k];
  $('recBody').innerHTML=`過關數<b>${cleared} / ${MAXSTAGE}</b><br>星星<b>★ ${stars} / ${MAXSTAGE*3}</b><br>闖關總分<b>${sum}</b><br>無盡最高分<b>${save.endless.best}</b><br>無盡最多打倒<b>${save.endless.kills}</b><br>總共打倒<b>${save.total}</b><br>總共賺過<b>💰 ${save.earned}</b><br>科技等級<b>${tech}</b>`;showOv('rec')});
on('bSnd',()=>setMute(!save.mute));
on('bReset',()=>{if(confirm('真的要把紀錄、錢、科技全部清掉嗎？')){const m=save.mute;save=fresh();save.mute=m;store();$('bRec').click()}});
on('bPause',()=>{if(G.state==='play')pauseGame()});on('bResume',resume);
on('bRetryP',()=>{bank(0);store();startGame(G.mode,G.stage)});on('bQuit',toMenu);
on('bNext',()=>startGame('stage',G.stage+1));on('bRetry',()=>startGame(G.mode,G.stage));on('bMenu',toMenu);
document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',()=>{sfx.click();showOv(backTo)}));
setMute(save.mute);store();
Object.assign(window,{G,H,save:()=>save,startGame,useItem,fury,joy,stats,TECH});
requestAnimationFrame(loop);
</script>
