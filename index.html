<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14122b">
<title>轟拳小子 Boom Fist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👊</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14122b;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));background:rgba(12,10,32,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-align:center;overflow-y:auto;touch-action:pan-y}
.ov.on{display:flex}
h1{margin:0;font-size:54px;line-height:1;font-weight:900;letter-spacing:2px;color:#ffd23f;text-shadow:0 4px 0 #d9480f,0 8px 0 #7a1d00,0 12px 18px rgba(0,0,0,.5);transform:rotate(-4deg)}
h1 small{display:block;font-size:17px;letter-spacing:6px;color:#fff;text-shadow:0 2px 0 #d9480f;margin-top:14px}
h2{margin:0;font-size:32px;font-weight:900;color:#ffd23f;text-shadow:0 3px 0 #d9480f}
.fist{font-size:70px;animation:bop .7s infinite alternate ease-in-out}
@keyframes bop{to{transform:translateY(-10px) rotate(8deg) scale(1.08)}}
button{font:inherit;color:#fff;border:0;border-radius:16px;padding:15px 20px;font-size:20px;font-weight:800;width:min(280px,80vw);background:#f76707;box-shadow:0 6px 0 #a33c00;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a33c00}
button.b2{background:#4263eb;box-shadow:0 6px 0 #263c9c}
button.b2:active{box-shadow:0 2px 0 #263c9c}
button.b3{background:#495057;box-shadow:0 6px 0 #25282b}
button.b3:active{box-shadow:0 2px 0 #25282b}
.row{display:flex;gap:10px;justify-content:center;width:min(280px,80vw)}
.row button{width:auto;flex:1;font-size:16px;padding:12px 6px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:min(360px,92vw)}
#grid button{width:auto;padding:8px 0 6px;font-size:19px;border-radius:12px;line-height:1.15}
#grid button span{display:block;font-size:10px;letter-spacing:1px;color:#ffd23f;height:12px}
#grid button.lock{background:#343a40;box-shadow:0 6px 0 #1c1f22;color:#777}
#grid button.boss{background:#c2255c;box-shadow:0 6px 0 #7a1238}
.stats{font-size:18px;line-height:1.9;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 22px;min-width:min(280px,80vw)}
.stats b{color:#ffd23f;float:right;margin-left:24px}
.stars{font-size:46px;letter-spacing:6px;color:#ffd23f;text-shadow:0 3px 0 #d9480f}
.stars i{font-style:normal;color:#444;text-shadow:none}
.new{color:#ff6b6b;font-weight:900;font-size:20px;animation:bop .4s infinite alternate}
p{margin:0;font-size:15px;line-height:1.7;color:#ccd;max-width:320px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ov on" id="menu">
  <div class="fist">👊</div>
  <h1>轟拳小子<small>BOOM FIST</small></h1>
  <div style="height:8px"></div>
  <button id="bStage">闖關模式</button>
  <button id="bEndless" class="b2">無盡模式</button>
  <div class="row">
    <button id="bRec" class="b3">🏆 紀錄</button>
    <button id="bHow" class="b3">❓ 玩法</button>
    <button id="bSnd" class="b3">🔊</button>
  </div>
</div>

<div class="ov" id="stages">
  <h2>選擇關卡</h2>
  <div id="grid"></div>
  <button class="b3 back">返回</button>
</div>

<div class="ov" id="how">
  <h2>玩法</h2>
  <p>👈 點<b>螢幕左邊</b>＝往左出拳<br>👉 點<b>螢幕右邊</b>＝往右出拳<br>
  壞蛋走進地上的<b>亮圈</b>才打得到。<br>
  <b>揮空</b>會發呆一下、連擊歸零！<br>
  連擊越高、分數越多。<br>
  下面的 🔥 集滿後點它＝全場大爆拳！<br><br>
  🔴 小兵　🟡 跑很快　🟣 要打 3 下<br>🟢 會跳到你背後　⚫ 魔王</p>
  <button class="b3 back">知道了</button>
</div>

<div class="ov" id="rec">
  <h2>🏆 我的紀錄</h2>
  <div class="stats" id="recBody"></div>
  <button class="b3 back">返回</button>
  <button class="b3" id="bReset" style="font-size:14px;padding:9px;width:160px;opacity:.7">清除紀錄</button>
</div>

<div class="ov" id="pause">
  <h2>暫停</h2>
  <button id="bResume">繼續</button>
  <button id="bRetryP" class="b2">重來</button>
  <button class="b3" id="bQuit">回主選單</button>
</div>

<div class="ov" id="result">
  <h2 id="rTitle"></h2>
  <div class="stars" id="rStars"></div>
  <div class="new" id="rNew">✨ 新紀錄！✨</div>
  <div class="stats" id="rBody"></div>
  <button id="bNext">下一關</button>
  <button id="bRetry" class="b2">再玩一次</button>
  <button class="b3" id="bMenu">回主選單</button>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const C=$('c'),g=C.getContext('2d');
const MAXSTAGE=30,RANGE=105,HITD=34,FURYNEED=20,KEY='boomfist_v1';

/* ---------- 存檔 ---------- */
let save={unlocked:1,stages:{},endless:{best:0,combo:0,kills:0},total:0,mute:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)save=Object.assign(save,s)}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

/* ---------- 聲音 (全部用程式合成) ---------- */
let ac=null,master=null,musicG=null,noiseBuf=null,musicOn=false,step=0,nextT=0;
function initAudio(){
  if(ac){if(ac.state!=='running')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();master=ac.createGain();master.gain.value=save.mute?0:1;master.connect(ac.destination);
  musicG=ac.createGain();musicG.gain.value=.5;musicG.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(musicTick,60);
}
function tone(f0,f1,dur,type,vol,t,out){
  if(!ac)return;t=t||ac.currentTime;
  const o=ac.createOscillator(),v=ac.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(v);v.connect(out||master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,freq,ftype,vol,t,out){
  if(!ac)return;t=t||ac.currentTime;
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();
  s.buffer=noiseBuf;f.type=ftype;f.frequency.value=freq;
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(v);v.connect(out||master);s.start(t,Math.random()*.3,dur+.02);
}
const sfx={
  hit(c){noise(.09,1400,'lowpass',.9);tone(190+Math.min(c,30)*6,55,.12,'sine',.9);tone(700+Math.min(c,30)*25,300,.05,'square',.12)},
  ko(){noise(.16,900,'lowpass',1);tone(140,38,.22,'sine',1)},
  miss(){noise(.13,2600,'highpass',.25)},
  hurt(){tone(260,70,.3,'sawtooth',.4);noise(.2,500,'lowpass',.7)},
  click(){tone(660,880,.06,'square',.15)},
  fury(){noise(.7,700,'lowpass',1);tone(90,30,.7,'sawtooth',.6);tone(300,1500,.4,'square',.2)},
  ready(){[523,659,784,1047].forEach((f,i)=>tone(f,f,.1,'square',.15,ac&&ac.currentTime+i*.06))},
  combo(n){const b=440*Math.pow(2,Math.min(n,60)/60);[1,1.25,1.5].forEach((m,i)=>tone(b*m,b*m,.09,'triangle',.3,ac&&ac.currentTime+i*.05))},
  clear(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f,.16,'square',.2,ac&&ac.currentTime+i*.11))},
  fail(){[392,330,262,196].forEach((f,i)=>tone(f,f*.97,.28,'sawtooth',.22,ac&&ac.currentTime+i*.2))},
  boss(){[110,104,98,92].forEach((f,i)=>tone(f,f,.3,'sawtooth',.35,ac&&ac.currentTime+i*.25))}
};
const BASS=[45,45,48,43],LEAD=[69,0,72,0,76,0,72,69,0,67,69,0,72,0,67,0, 69,0,72,0,76,79,76,0,72,0,69,0,67,64,67,0];
const mf=m=>440*Math.pow(2,(m-69)/12);
function musicTick(){
  if(!ac||!musicOn||ac.state!=='running')return;
  const sd=60/138/4;if(nextT<ac.currentTime)nextT=ac.currentTime+.05;
  while(nextT<ac.currentTime+.2){
    const s=step%64,b=BASS[(s>>4)%4];
    if(s%4===0){tone(120,40,.12,'sine',.7,nextT,musicG)}
    if(s%4===2){noise(.03,6000,'highpass',.12,nextT,musicG)}
    if(s%8===4){noise(.08,1800,'bandpass',.3,nextT,musicG)}
    if(s%2===0){tone(mf(b+(s%4===2?12:0)),mf(b),.11,'square',.1,nextT,musicG)}
    const l=LEAD[s%32];if(l)tone(mf(l),mf(l),.13,'triangle',.16,nextT,musicG);
    step++;nextT+=sd;
  }
}
function setMute(m){save.mute=m;store();if(master)master.gain.value=m?0:1;$('bSnd').textContent=m?'🔇':'🔊'}
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden){ac.suspend();if(G.state==='play')pauseGame()}else ac.resume()});
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- 畫面大小 ---------- */
let W=400,H=700,S=1,GY=420,HX=200;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2.5),w=innerWidth,h=innerHeight;
  C.width=Math.round(w*dpr);C.height=Math.round(h*dpr);
  if(w/h<.8){W=400;H=400*h/w}else{H=640;W=640*w/h}
  S=C.width/W;GY=H*.62;HX=W/2;
}
addEventListener('resize',resize);resize();

/* ---------- 遊戲狀態 ---------- */
const TYPES={
  grunt:{hp:1,spd:72,sz:1,col:'#e5484d',pts:10,kb:0},
  runner:{hp:1,spd:150,sz:.82,col:'#f5a524',pts:15,kb:0},
  tank:{hp:3,spd:46,sz:1.3,col:'#8e4ec6',pts:30,kb:58},
  jumper:{hp:1,spd:84,sz:.95,col:'#30a46c',pts:20,kb:0},
  boss:{hp:10,spd:56,sz:1.75,col:'#22202e',pts:200,kb:74}
};
const THEMES=[['#ff9a56','#ffd9a0','#7a4a2b','#5b2d4e'],['#3a7bd5','#a8e0ff','#3f7d3a','#2a5a8a'],['#1b1464','#6a3093','#2c2540','#120c33'],['#f857a6','#ffb88c','#8a3b3b','#7a2a55'],['#0f2027','#2c5364','#1d3238','#0a1418']];
const G={state:'menu',mode:'stage',stage:1,hero:null,en:[],parts:[],texts:[],corpses:[],score:0,combo:0,maxCombo:0,kills:0,
  toSpawn:0,need:0,spawnT:0,lastSide:1,sameSide:0,bossOut:false,boss:null,fury:0,shake:0,freeze:0,flash:0,endT:0,time:0,nextBoss:50,bld:[],tut:0};

function startGame(mode,stage){
  initAudio();musicOn=true;
  Object.assign(G,{state:'play',mode,stage:stage||1,en:[],parts:[],texts:[],corpses:[],score:0,combo:0,maxCombo:0,kills:0,spawnT:1,
    sameSide:0,bossOut:false,boss:null,fury:0,shake:0,freeze:0,flash:0,endT:0,time:0,nextBoss:50,tut:(mode==='stage'&&stage===1)?6:0});
  G.hero={dir:1,punchT:0,stun:0,inv:0,hp:3,walk:0};
  G.need=G.toSpawn=mode==='stage'?10+stage*2:Infinity;
  G.bld=[];let x=-20,r=mulberry(stage*77+(mode==='stage'?1:999));
  while(x<1400){const w=30+r()*50;G.bld.push([x,w,40+r()*130,r()]);x+=w+r()*14}
  showOv(null);
}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lvl=()=>G.mode==='stage'?G.stage:1+Math.floor(G.kills/12);
const spdMul=()=>Math.min(1.85,1+lvl()*.035);
const mult=()=>Math.min(5,1+Math.floor(G.combo/10)*.5);

function spawn(type,side){
  const T=TYPES[type],n=lvl();
  const e={type,side,d:W/2+40+Math.random()*30,hp:T.hp,spd:T.spd*spdMul()*(.9+Math.random()*.2),sz:T.sz,col:T.col,stag:0,flash:0,walk:Math.random()*9,jumpT:-1,jumped:false,d0:0};
  if(type==='boss'){e.hp=G.mode==='stage'?7+n:8+Math.floor(n/2);e.d=W/2+70}
  e.max=e.hp;G.en.push(e);return e;
}
function pickType(){
  const n=lvl(),w=[['grunt',10]];
  if(n>=2)w.push(['runner',2+n*.3]);if(n>=4)w.push(['tank',1+n*.2]);if(n>=6)w.push(['jumper',1+n*.22]);
  if(G.boss)w.length=Math.min(w.length,2);
  let t=0;w.forEach(x=>t+=x[1]);let r=Math.random()*t;
  for(const x of w){if((r-=x[1])<0)return x[0]}return 'grunt';
}
function pickSide(){
  let s=Math.random()<.5?1:-1;
  if(s===G.lastSide){if(++G.sameSide>=3){s=-s;G.sameSide=0}}else G.sameSide=0;
  G.lastSide=s;return s;
}
function callBoss(){G.boss=spawn('boss',pickSide());G.bossOut=true;sfx.boss();addText(HX,H*.3,'⚠ 魔王來了 ⚠','#ff6b6b',2,34)}

/* ---------- 出拳 ---------- */
function punch(dir){
  const h=G.hero;if(G.state!=='play'||h.stun>0)return;
  h.dir=dir;h.punchT=.14;
  let best=null;
  for(const e of G.en)if(e.side===dir&&e.jumpT<0&&e.d<=RANGE+e.sz*6&&(!best||e.d<best.d))best=e;
  if(!best){h.stun=.26;if(G.combo>=5)addText(HX,GY-130,'揮空！','#aaa',.7,22);G.combo=0;sfx.miss();return}
  damage(best,1);
}
function damage(e,dmg,quiet){
  const T=TYPES[e.type],ex=HX+e.side*e.d,ey=GY-55*e.sz;
  e.hp-=dmg;e.flash=.1;
  G.combo++;if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  if(G.fury<FURYNEED&&!quiet){G.fury++;if(G.fury===FURYNEED)sfx.ready()}
  burst(ex-e.side*14,ey,e.hp<=0?12:6,e.hp<=0?'#ffd23f':'#fff');
  if(e.hp<=0){
    const pts=Math.round(T.pts*mult());G.score+=pts;G.kills++;save.total++;
    addText(ex,ey-30,'+'+pts,'#ffd23f',.7,e.type==='boss'?30:18);
    G.corpses.push({x:ex,y:GY,vx:e.side*(260+Math.random()*220),vy:-(300+Math.random()*250),rot:0,vr:e.side*(6+Math.random()*8),col:e.col,sz:e.sz,type:e.type,dir:-e.side});
    G.en.splice(G.en.indexOf(e),1);
    if(e.type==='boss'){G.boss=null;G.shake=18;G.freeze=.18;sfx.ko();sfx.fury();buzz(80);
      if(G.mode==='endless'){if(G.hero.hp<3){G.hero.hp++;addText(HX,GY-140,'+❤','#ff6b6b',1,26)}G.bossOut=false;G.nextBoss=G.kills+50}
      else for(const o of G.en.slice())damage(o,99,true)}
    else if(!quiet){G.shake=Math.max(G.shake,5);G.freeze=.035;sfx.hit(G.combo);if(e.max>1)sfx.ko();buzz(12)}
  }else{
    e.d+=T.kb;e.stag=.28;if(!quiet){G.shake=Math.max(G.shake,4);G.freeze=.03;sfx.hit(G.combo);buzz(10)}
    if(e.type==='boss')e.spd*=1.05;
  }
  if(G.combo%10===0&&!quiet){sfx.combo(G.combo);addText(HX,GY-170,G.combo+' 連擊！','#ff922b',1,30)}
}
function fury(){
  if(G.state!=='play'||G.fury<FURYNEED)return;
  G.fury=0;G.flash=.35;G.shake=22;G.hero.punchT=.3;G.hero.stun=0;sfx.fury();buzz(120);
  addText(HX,GY-180,'大爆拳！！','#ff3b3b',1.1,40);
  for(let i=0;i<30;i++)burst(HX+(Math.random()-.5)*W,GY-Math.random()*120,2,'#ffd23f');
  for(const e of G.en.slice())if(e.jumpT<0||true){e.jumpT=-1;damage(e,e.type==='boss'?4:3,true)}
}
function hurtHero(e){
  const h=G.hero;e.d=135;e.stag=.55;
  if(h.inv>0)return;
  h.hp--;h.inv=1;h.stun=.2;G.combo=0;G.shake=14;G.flash=.12;sfx.hurt();buzz(60);
  burst(HX,GY-55,10,'#ff6b6b');
  if(h.hp<=0){G.state='dead';G.endT=1.1;musicOn=false;sfx.fail();
    G.corpses.push({x:HX,y:GY,vx:-e.side*200,vy:-380,rot:0,vr:-e.side*7,col:'#3b82f6',sz:1.1,type:'hero',dir:h.dir})}
}
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=80+Math.random()*260;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.25+Math.random()*.25,col,r:2+Math.random()*4})}}
function addText(x,y,txt,col,life,size){G.texts.push({x,y,txt,col,life,max:life,size})}

/* ---------- 更新 ---------- */
function update(dt){
  G.shake*=Math.pow(.001,dt);G.flash=Math.max(0,G.flash-dt);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y-=40*dt;t.life-=dt}
  G.texts=G.texts.filter(t=>t.life>0);
  for(const c of G.corpses){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=1300*dt;c.rot+=c.vr*dt}
  G.corpses=G.corpses.filter(c=>c.y<H+200);
  if(G.state==='dead'||G.state==='clear'){G.endT-=dt;if(G.endT<=0)finish(G.state==='clear');return}
  if(G.state!=='play')return;
  if(G.freeze>0){G.freeze-=dt;return}
  G.time+=dt;if(G.tut>0)G.tut-=dt;
  const h=G.hero;h.punchT=Math.max(0,h.punchT-dt);h.stun=Math.max(0,h.stun-dt);h.inv=Math.max(0,h.inv-dt);h.walk+=dt;
  // 出怪
  G.spawnT-=dt;
  if(G.spawnT<=0&&(G.toSpawn>0||G.boss)){
    let iv=Math.max(.36,1.15-lvl()*.028);if(G.boss)iv*=1.9;
    G.spawnT=iv*(.7+Math.random()*.6);
    spawn(pickType(),pickSide());if(!G.boss)G.toSpawn--;
  }
  if(G.mode==='endless'&&!G.bossOut&&G.kills>=G.nextBoss)callBoss();
  if(G.mode==='stage'&&G.toSpawn<=0&&!G.en.length){
    if(G.stage%5===0&&!G.bossOut)callBoss();
    else if(!G.boss){G.state='clear';G.endT=1;musicOn=false;sfx.clear();addText(HX,H*.3,'過關！','#ffd23f',1.2,48)}
  }
  // 壞蛋
  for(const e of G.en.slice()){
    e.flash=Math.max(0,e.flash-dt);e.walk+=dt;
    if(e.stag>0){e.stag-=dt;continue}
    if(e.jumpT>=0){e.jumpT+=dt;if(e.jumpT>=.55){e.jumpT=-1;e.side=-e.side;e.d=108}continue}
    e.d-=e.spd*dt;
    if(e.type==='jumper'&&!e.jumped&&e.d<150){e.jumped=true;e.jumpT=0;e.d0=e.d;continue}
    if(e.d<=HITD+e.sz*4)hurtHero(e);
  }
}
function finish(win){
  G.state='over';let isNew=false,body='';
  if(G.mode==='stage'){
    const st=save.stages[G.stage]||{stars:0,best:0};
    if(win){const stars=G.hero.hp;isNew=G.score>st.best;st.stars=Math.max(st.stars,stars);st.best=Math.max(st.best,G.score);save.stages[G.stage]=st;
      save.unlocked=Math.max(save.unlocked,Math.min(MAXSTAGE,G.stage+1));
      $('rStars').innerHTML='★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i>'}
    $('rTitle').textContent=win?`第 ${G.stage} 關 過關！`:`第 ${G.stage} 關 失敗…`;
    $('rStars').style.display=win?'':'none';
    $('bNext').style.display=win&&G.stage<MAXSTAGE?'':'none';
    body=`分數<b>${G.score}</b><br>最高連擊<b>${G.maxCombo}</b><br>這關最高分<b>${st.best}</b>`;
  }else{
    const E=save.endless;isNew=G.score>E.best;
    E.best=Math.max(E.best,G.score);E.combo=Math.max(E.combo,G.maxCombo);E.kills=Math.max(E.kills,G.kills);
    $('rTitle').textContent='無盡模式 結束';$('rStars').style.display='none';$('bNext').style.display='none';
    body=`分數<b>${G.score}</b><br>打倒<b>${G.kills}</b><br>最高連擊<b>${G.maxCombo}</b><br>歷史最高分<b>${E.best}</b>`;
  }
  $('rNew').style.display=isNew&&G.score>0?'':'none';$('rBody').innerHTML=body;store();showOv('result');
}

/* ---------- 畫圖 ---------- */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ln(a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function fighter(x,y,sz,col,dir,o){
  g.save();g.translate(x,y);if(o.rot){g.translate(0,-45*sz);g.rotate(o.rot);g.translate(0,45*sz)}
  g.scale(sz*dir,sz);
  const bob=Math.sin(o.walk*11)*2,l=o.still?0:Math.sin(o.walk*11)*9,p=o.punch||0,fl=o.flash;
  g.lineCap='round';g.strokeStyle='#1a1a22';g.lineWidth=8;
  ln(-5,-26,-7+l,-3);ln(5,-26,7-l,-3);
  // 後手
  g.strokeStyle=fl?'#fff':col;g.lineWidth=7;ln(-6,-54+bob,-12-p*6,-42+bob);
  g.fillStyle=fl?'#fff':'#ffd8a8';g.beginPath();g.arc(-12-p*6,-40+bob,6,0,7);g.fill();
  // 身體
  g.fillStyle=fl?'#fff':col;rr(-13,-63+bob,26,40,10);g.fill();
  if(o.belt){g.fillStyle=o.belt;g.fillRect(-13,-36+bob,26,5)}
  // 頭
  g.fillStyle=fl?'#fff':(o.skin||'#ffd8a8');g.beginPath();g.arc(2,-78+bob,15,0,7);g.fill();
  if(o.band){g.fillStyle=o.band;g.fillRect(-13,-88+bob,30,6);g.beginPath();g.moveTo(-12,-86+bob);g.lineTo(-26,-80+bob+Math.sin(o.walk*8)*3);g.lineTo(-24,-90+bob);g.fill()}
  if(o.horn){g.fillStyle='#ff3b3b';g.beginPath();g.moveTo(-8,-90+bob);g.lineTo(-12,-104+bob);g.lineTo(-1,-92+bob);g.moveTo(8,-91+bob);g.lineTo(14,-104+bob);g.lineTo(14,-88+bob);g.fill()}
  // 臉
  g.fillStyle=o.eye||'#1a1a22';
  if(o.ko){g.strokeStyle='#1a1a22';g.lineWidth=2;ln(5,-82+bob,11,-76+bob);ln(11,-82+bob,5,-76+bob)}
  else{g.beginPath();g.arc(9,-80+bob,2.6,0,7);g.fill();
    if(o.angry){g.strokeStyle='#1a1a22';g.lineWidth=2.5;ln(3,-87+bob,13,-83+bob)}}
  // 前手
  const fx=15+p*36,fy=-50+bob-p*4;
  g.strokeStyle=fl?'#fff':col;g.lineWidth=8;ln(8,-54+bob,fx-4,fy);
  g.fillStyle=fl?'#fff':(o.glove||'#ffd8a8');g.beginPath();g.arc(fx,fy,8+p*3,0,7);g.fill();
  g.restore();
}
function shadow(x,w){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,GY+2,w,6,0,0,7);g.fill()}
function drawEnemy(e){
  let x=HX+e.side*e.d,y=GY,dir=-e.side;
  if(e.jumpT>=0){const p=e.jumpT/.55;x=HX+e.side*e.d0+(-e.side*108-e.side*e.d0)*p;y=GY-Math.sin(p*Math.PI)*130}
  shadow(x,20*e.sz);
  const near=e.jumpT<0&&e.d<HITD+40;
  fighter(x,y,e.sz,e.col,dir,{walk:e.walk,punch:near?.8:0,flash:e.flash>0,angry:true,horn:e.type==='boss',eye:e.type==='boss'?'#ff3b3b':null,
    skin:e.type==='boss'?'#6b6680':e.type==='jumper'?'#c9f2d5':'#f1c9a0',rot:e.stag>0?-dir*.25:0,still:e.stag>0});
  if(e.max>1){const w=40*e.sz,bx=x-w/2,by=y-100*e.sz-(e.type==='boss'?14:6);
    g.fillStyle='rgba(0,0,0,.5)';rr(bx,by,w,6,3);g.fill();g.fillStyle='#ff6b6b';rr(bx,by,Math.max(6,w*e.hp/e.max),6,3);g.fill()}
}
function drawBg(){
  const th=THEMES[(G.mode==='stage'?Math.floor((G.stage-1)/5)+(G.stage%5===0?2:0):Math.floor(G.kills/50))%THEMES.length];
  const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,th[0]);gr.addColorStop(1,th[1]);
  g.fillStyle=gr;g.fillRect(-30,-30,W+60,GY+30);
  g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(W*.76,GY*.3,34,0,7);g.fill();
  g.fillStyle=th[3];
  for(const b of G.bld){if(b[0]>W+30)break;g.globalAlpha=.55+b[3]*.4;g.fillRect(b[0],GY-b[2],b[1],b[2])}
  g.globalAlpha=1;
  g.fillStyle=th[2];g.fillRect(-30,GY-4,W+60,H-GY+40);
  g.fillStyle='rgba(255,255,255,.08)';g.fillRect(-30,GY-4,W+60,6);
  g.fillStyle='rgba(0,0,0,.12)';for(let i=0;i<8;i++)g.fillRect(-30,GY+26+i*i*7,W+60,3);
}
function drawRange(){
  for(const s of[-1,1]){
    const hot=G.en.some(e=>e.side===s&&e.jumpT<0&&e.d<=RANGE+e.sz*6);
    g.fillStyle=hot?'rgba(255,210,63,.5)':'rgba(255,255,255,.13)';
    g.beginPath();g.ellipse(HX+s*(RANGE+HITD)/2,GY+3,(RANGE-HITD)/2+8,9,0,0,7);g.fill();
  }
}
function txt(s,x,y,size,col,al){g.font=`900 ${size}px system-ui,"PingFang TC","Noto Sans TC",sans-serif`;g.textAlign=al||'center';g.lineJoin='round';g.lineWidth=size/5;g.strokeStyle='rgba(0,0,0,.65)';g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}
const SAFE=()=>Math.max(10,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0);
function drawHud(){
  const top=14+safeTop;
  for(let i=0;i<3;i++)txt(i<G.hero.hp?'❤':'🖤',22+i*30,top+24,24,'#ff4d4d');
  txt(String(G.score),HX,top+28,32,'#fff');
  txt(G.mode==='stage'?`第 ${G.stage} 關`:`無盡 Lv.${lvl()}`,HX,top+48,13,'#ffd23f');
  // 暫停
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(W-30,top+18,18,0,7);g.fill();
  g.fillStyle='#fff';g.fillRect(W-37,top+10,5,16);g.fillRect(W-28,top+10,5,16);
  // 進度
  if(G.mode==='stage'){const w=W-120,p=Math.min(1,G.kills/G.need);g.fillStyle='rgba(0,0,0,.35)';rr(60,top+58,w,8,4);g.fill();
    if(p>0){g.fillStyle='#ffd23f';rr(60,top+58,Math.max(8,w*p),8,4);g.fill()}
    if(G.stage%5===0)txt('👹',60+w+14,top+68,18,'#fff')}
  if(G.combo>=2){const s=1+Math.min(.5,G.hero.punchT*3);g.save();g.translate(HX,GY-215);g.scale(s,s);g.rotate(-.06);
    txt(G.combo+'',0,0,54,'#ff922b');txt('連擊  x'+mult(),0,22,16,'#fff');g.restore()}
  // 大招鈕
  const fx=HX,fy=H-64-safeBot,fr=36,p=G.fury/FURYNEED,full=p>=1;
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.arc(fx,fy,fr,0,7);g.fill();
  g.strokeStyle=full?`hsl(${(G.time*300)%60+10},100%,60%)`:'#ff922b';g.lineWidth=7;g.lineCap='round';
  g.beginPath();g.arc(fx,fy,fr-4,-Math.PI/2,-Math.PI/2+Math.max(.001,p)*6.283);g.stroke();
  g.globalAlpha=full?1:.35;txt('🔥',fx,fy+13+(full?Math.sin(G.time*14)*3:0),full?40:32,'#fff');g.globalAlpha=1;
  if(full)txt('點我！',fx,fy-fr-8,15,'#ffd23f');
  // 左右提示
  g.globalAlpha=.16;txt('◀',40,H-52-safeBot,44,'#fff');txt('▶',W-40,H-52-safeBot,44,'#fff');g.globalAlpha=1;
  if(G.tut>0){g.globalAlpha=Math.min(1,G.tut);txt('點左邊 👈 打左邊',HX,GY+70,22,'#fff');txt('點右邊 👉 打右邊',HX,GY+100,22,'#fff');txt('等壞蛋走進亮圈再打！',HX,GY+130,17,'#ffd23f');g.globalAlpha=1}
}
let safeTop=0,safeBot=0;
function readSafe(){const d=document.createElement('div');d.style.cssText='position:fixed;top:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';document.body.appendChild(d);
  const cs=getComputedStyle(d),k=W/innerWidth;safeTop=(parseFloat(cs.paddingTop)||0)*k;safeBot=(parseFloat(cs.paddingBottom)||0)*k;d.remove()}
readSafe();addEventListener('resize',readSafe);

function draw(){
  g.setTransform(S,0,0,S,0,0);
  const sh=G.shake;g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  drawBg();
  const inGame=G.state!=='menu';
  if(inGame)drawRange();
  for(const e of G.en)drawEnemy(e);
  const h=G.hero;
  if(h&&(G.state!=='dead'&&G.state!=='over'||h.hp>0)){
    shadow(HX,22);
    if(!(h.inv>0&&Math.floor(h.inv*14)%2))
      fighter(HX,GY,1.1,'#3b82f6',h.dir,{walk:h.walk*.35,still:true,punch:Math.min(1,h.punchT/.09),band:'#ff3b3b',belt:'#ffd23f',glove:'#ff3b3b',ko:h.stun>.05&&h.punchT<=0});
    if(h.stun>.05&&h.punchT<=0)txt('💫',HX,GY-118,22,'#fff');
  }
  for(const c of G.corpses)fighter(c.x,c.y,c.sz,c.col,c.dir,{walk:0,still:true,rot:c.rot,ko:true,horn:c.type==='boss',band:c.type==='hero'?'#ff3b3b':null});
  for(const p of G.parts){g.globalAlpha=Math.min(1,p.life*4);g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
  g.globalAlpha=1;
  for(const t of G.texts){g.globalAlpha=Math.min(1,t.life/t.max*2.5);txt(t.txt,t.x,t.y,t.size,t.col)}
  g.globalAlpha=1;
  if(inGame&&h)drawHud();
  if(G.flash>0){g.fillStyle=`rgba(255,255,255,${Math.min(.8,G.flash*2.5)})`;g.fillRect(-40,-40,W+80,H+80)}
}
let last=0;
function loop(t){
  const dt=Math.min(.034,(t-last)/1000||0);last=t;
  if(G.state!=='pause')update(dt);
  draw();requestAnimationFrame(loop);
}

/* ---------- 操作 ---------- */
function tap(cx,cy){
  if(G.state!=='play')return;
  const x=cx/innerWidth*W,y=cy/innerHeight*H;
  if(Math.hypot(x-(W-30),y-(32+safeTop))<28){pauseGame();return}
  if(Math.hypot(x-HX,y-(H-64-safeBot))<46){if(G.fury>=FURYNEED)fury();return}
  punch(x<HX?-1:1);
}
C.addEventListener('touchstart',e=>{e.preventDefault();initAudio();for(const t of e.changedTouches)tap(t.clientX,t.clientY)},{passive:false});
C.addEventListener('mousedown',e=>{initAudio();tap(e.clientX,e.clientY)});
addEventListener('keydown',e=>{if(e.repeat)return;
  if(e.key==='ArrowLeft'||e.key==='a')punch(-1);else if(e.key==='ArrowRight'||e.key==='d')punch(1);
  else if(e.key===' ')fury();else if(e.key==='Escape'){if(G.state==='play')pauseGame();else if(G.state==='pause')resume()}});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- 選單 ---------- */
function showOv(id){document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('on',o.id===id))}
function pauseGame(){G.state='pause';musicOn=false;showOv('pause')}
function resume(){G.state='play';musicOn=true;showOv(null)}
function toMenu(){G.state='menu';G.en=[];G.hero=null;G.corpses=[];G.texts=[];musicOn=false;showOv('menu')}
function buildGrid(){
  const gd=$('grid');gd.innerHTML='';
  for(let i=1;i<=MAXSTAGE;i++){
    const b=document.createElement('button'),st=save.stages[i],open=i<=save.unlocked;
    b.className=open?(i%5===0?'boss':''):'lock';
    b.innerHTML=(open?i:'🔒')+'<span>'+(st?'★'.repeat(st.stars):'')+'</span>';
    if(open)b.onclick=()=>{sfx.click();startGame('stage',i)};
    gd.appendChild(b);
  }
}
function on(id,f){$(id).addEventListener('click',()=>{initAudio();sfx.click();f()})}
on('bStage',()=>{buildGrid();showOv('stages')});
on('bEndless',()=>startGame('endless'));
on('bHow',()=>showOv('how'));
on('bRec',()=>{
  let stars=0,cleared=0,sum=0;for(const k in save.stages){stars+=save.stages[k].stars;sum+=save.stages[k].best;if(save.stages[k].stars)cleared++}
  $('recBody').innerHTML=`過關數<b>${cleared} / ${MAXSTAGE}</b><br>星星<b>★ ${stars} / ${MAXSTAGE*3}</b><br>闖關總分<b>${sum}</b><br>無盡最高分<b>${save.endless.best}</b><br>無盡最多打倒<b>${save.endless.kills}</b><br>最高連擊<b>${save.endless.combo}</b><br>總共打倒<b>${save.total}</b>`;
  showOv('rec')});
on('bSnd',()=>setMute(!save.mute));
on('bReset',()=>{if(confirm('真的要把紀錄全部清掉嗎？')){save={unlocked:1,stages:{},endless:{best:0,combo:0,kills:0},total:0,mute:save.mute};store();$('bRec').click()}});
on('bResume',resume);
on('bRetryP',()=>startGame(G.mode,G.stage));
on('bQuit',()=>{store();toMenu()});
on('bNext',()=>startGame('stage',G.stage+1));
on('bRetry',()=>startGame(G.mode,G.stage));
on('bMenu',toMenu);
document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',()=>{sfx.click();showOv('menu')}));
setMute(save.mute);
G.bld=[];{let x=-20;const r=mulberry(5);while(x<1400){const w=30+r()*50;G.bld.push([x,w,40+r()*130,r()]);x+=w+r()*14}}
requestAnimationFrame(loop);
</script>
</body>
